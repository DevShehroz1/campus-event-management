<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CampusHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl bg-orange-600 flex items-center justify-center text-white font-bold text-base shadow-lg shadow-orange-600/30">C</span>
                <span class="text-xl font-bold tracking-tight text-white">CampusHub</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Overview</a>
                <a href="events.html" class="hover:text-white transition-colors">Directory</a>
                <a href="dashboard.html" class="text-orange-500 transition-colors">Dashboard</a>
            </nav>
            <div class="flex items-center gap-3">
                <button id="signOutBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition-all">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full">
        
        <!-- User Profile Banner -->
        <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-8 mb-12 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 shadow-xl">
            <div class="flex items-center gap-5">
                <div id="userInitials" class="w-16 h-16 rounded-2xl bg-orange-600 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-orange-600/30">
                    US
                </div>
                <div>
                    <h1 id="userNameDisplay" class="text-2xl font-bold text-white tracking-tight">Welcome back</h1>
                    <p id="userDeptDisplay" class="text-slate-400 text-xs mt-1 font-medium">ID: 4091</p>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <!-- Hidden by default, unhidden via JS only for admin -->
                <a href="create-event.html" id="hostEventBtn" class="hidden bg-orange-600 hover:bg-orange-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-orange-600/30">Host New Event</a>
                <a href="events.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all border border-slate-700">Browse Events Directory</a>
            </div>
        </div>

        <!-- Registrations Section -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-white tracking-tight">My Event Registrations</h2>
            <p class="text-slate-400 text-xs mt-0.5">Manage the events you have signed up for</p>
        </div>

        <div id="dashboardRegistrations" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamically rendered registrations will appear here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-8 px-6 text-center text-sm text-slate-400">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 CampusHub. Built for student collaboration.</p>
            <div class="flex gap-6 text-slate-400 font-medium">
                <a href="index.html" class="hover:text-white">Privacy</a>
                <a href="index.html" class="hover:text-white">Terms</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
