<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details & Registration — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">

    <div id="site-header"></div>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full">
        <div class="mb-8">
            <a href="events.html" class="text-sm font-semibold text-slate-400 hover:text-orange-400 transition-colors flex items-center gap-1 w-fit">
                <span>&larr;</span> Back to Directory
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Left 2 Columns: Dynamic Event Info -->
            <div class="lg:col-span-2 space-y-8">
                <div class="rounded-2xl overflow-hidden border border-slate-800 h-80 relative">
                    <img id="eventDetailImage" src="" alt="Event Banner" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                </div>

                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <span id="eventDetailCategory" class="text-xs font-semibold uppercase tracking-wider text-orange-400 bg-orange-500/10 px-3 py-1 rounded-md border border-orange-500/20"></span>
                        <span id="eventDetailDate" class="text-xs text-slate-400"></span>
                    </div>
                    <h1 id="eventDetailTitle" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-4"></h1>
                    <p id="eventDetailDescription" class="text-slate-300 leading-relaxed text-base mb-6">
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
                        <div>
                            <span class="text-xs text-slate-400 block mb-1 font-medium">Location</span>
                            <span id="eventDetailLocation" class="text-white font-semibold text-sm"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block mb-1 font-medium">Available Seats</span>
                            <span id="eventDetailSeats" class="text-orange-400 font-semibold text-sm"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block mb-1 font-medium">Organizer</span>
                            <span id="eventDetailOrganizer" class="text-white font-semibold text-sm"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400 block mb-1 font-medium">Prerequisites</span>
                            <span id="eventDetailPrereq" class="text-white font-semibold text-sm"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Registration Card Container (Protected by Login Guard in JS) -->
            <div class="lg:col-span-1" id="registrationCardContainer">
                <div class="bg-slate-900/80 rounded-2xl border border-slate-800 p-6 sticky top-28 shadow-xl">
                    <h3 class="text-xl font-bold text-white mb-2">Register for Event</h3>
                    <p class="text-slate-400 text-xs mb-6">Fill in your student credentials to reserve your seat instantly.</p>
                    
                    <form id="registrationForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Full Name</label>
                            <input type="text" required placeholder="Alex Johnson" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">University Email</label>
                            <input type="email" required placeholder="alex@university.edu" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Student ID</label>
                            <input type="text" required placeholder="CS-2026-4091" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Department</label>
                            <select class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-300 focus:outline-none focus:border-orange-500 transition-colors">
                                <option>Computer Science</option>
                                <option>Electrical Engineering</option>
                                <option>Mechanical Engineering</option>
                                <option>Business Administration</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-orange-600/30 text-sm mt-2">Confirm Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
