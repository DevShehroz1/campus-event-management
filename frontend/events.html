<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Directory — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased flex flex-col min-h-screen selection:bg-orange-500 selection:text-white">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl bg-orange-600 flex items-center justify-center text-white font-bold text-base shadow-lg shadow-orange-600/30">C</span>
                <span class="text-xl font-bold tracking-tight text-white">CampusHub</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Overview</a>
                <a href="events.html" class="text-orange-500 transition-colors">Directory</a>
                <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
            </nav>
            <div class="flex items-center gap-3">
                <a href="login.html" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-orange-600/30">Sign In</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Events Directory</h1>
                <p class="text-slate-400 text-sm mt-1">Explore and filter all active campus seminars, workshops, and activities.</p>
            </div>
            
            <!-- Search & Filter Controls -->
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="searchEvents" placeholder="Search events..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 transition-colors w-full sm:w-64">
                <select id="categoryFilter" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-orange-500 transition-colors">
                    <option value="all">All Categories</option>
                    <option value="workshop">Workshop</option>
                    <option value="seminar">Seminar</option>
                    <option value="competition">Competition</option>
                    <option value="sports">Sports Event</option>
                    <option value="conference">Conference</option>
                    <option value="society">Student Society Activity</option>
                </select>
            </div>
        </div>

        <!-- Dynamic Events Grid Container -->
        <div id="eventsDirectoryGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Events rendered dynamically via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-8 px-6 text-center text-sm text-slate-400 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 CampusHub. Built for student collaboration.</p>
            <div class="flex gap-6 text-slate-400 font-medium">
                <a href="index.html" class="hover:text-white">Privacy</a>
                <a href="index.html" class="hover:text-white">Terms</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
