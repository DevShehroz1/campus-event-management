<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Events — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="site-header"></div>

    <main class="wrap">
        <section class="view" aria-label="Events">

            <div class="page-title">
                <span class="eyebrow">Events directory</span>
                <h1>All campus events</h1>
                <p>Search by name, place or organiser, or narrow the list by category.</p>
            </div>

            <div class="stack">
                <div class="toolbar glass">
                    <div class="row">
                        <div class="search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                            <label for="events-search" class="sr-only">Search events</label>
                            <input id="events-search" type="search" autocomplete="off" placeholder="Search events, e.g. AI workshop">
                        </div>
                        <label for="events-category" class="sr-only">Category</label>
                        <select id="events-category"></select>
                    </div>
                    <div class="chips" id="events-chips"></div>
                </div>

                <div class="result-line">
                    <span id="events-count"></span>
                    <button class="btn btn-ghost" id="events-clear" hidden>Clear filters</button>
                </div>

                <div class="grid" id="events-grid"></div>
            </div>

        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/events.js"></script>
</body>
</html>
