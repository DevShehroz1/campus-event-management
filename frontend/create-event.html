<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create event — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14 w-full">
        <div class="mb-8">
            <p class="text-xs uppercase tracking-widest font-semibold text-orange-600 mb-2">Admin</p>
            <h1 class="text-4xl sm:text-5xl font-extrabold text-stone-900 tracking-tight">Host a <span class="font-serif-italic text-orange-600">new event</span></h1>
            <p class="text-stone-600 text-sm sm:text-base mt-2">Create seminars, workshops, sports, and society activities. Fields marked with * are required.</p>
        </div>

        <div class="bg-white border border-stone-200 rounded-3xl p-6 sm:p-8 elevate-1">
            <p class="text-sm text-stone-500">The admin event form will be wired up in the next release.</p>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        (function () {
            function guard() {
                if (!window.isLoggedIn()) {
                    location.replace('login.html?redirect=create-event.html');
                    return;
                }
                if (!window.isAdmin()) {
                    window.ui.setFlash('Only administrators can access that page', 'error');
                    location.replace('dashboard.html');
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', guard);
            } else {
                guard();
            }
        })();
    </script>
</body>
</html>
