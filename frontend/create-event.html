<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create event — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 py-10 sm:py-14 w-full">

        <div class="mb-8">
            <p id="event-form-eyebrow" class="text-xs uppercase tracking-widest font-semibold text-orange-600 mb-2">Admin</p>
            <h1 id="event-form-heading" class="text-4xl sm:text-5xl font-extrabold text-stone-900 tracking-tight">Host a <span class="font-serif-italic text-orange-600">new event</span></h1>
            <p id="event-form-subheading" class="text-stone-600 text-sm sm:text-base mt-2">Create seminars, workshops, sports, and society activities. Fields marked with * are required.</p>
        </div>

        <form id="event-form" class="bg-white border border-stone-200 rounded-3xl p-6 sm:p-8 elevate-1 space-y-6" novalidate>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="event-title" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Title *</label>
                    <input id="event-title" name="title" type="text" required placeholder="Advanced AI Hackathon"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="event-category" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Category *</label>
                    <select id="event-category" name="category" required
                            class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                        <option value="">Choose a category…</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="event-date" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Date *</label>
                    <input id="event-date" name="date" type="date" required
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="event-time" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Time *</label>
                    <input id="event-time" name="time" type="text" required placeholder="10:00 AM - 02:00 PM"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="event-location" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Location / Venue *</label>
                    <input id="event-location" name="location" type="text" required placeholder="Main Auditorium"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="event-capacity" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Capacity *</label>
                    <input id="event-capacity" name="capacity" type="number" min="1" step="1" required placeholder="100"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="event-organizer" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Organizer *</label>
                    <input id="event-organizer" name="organizer" type="text" required placeholder="AI &amp; Machine Learning Society"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="event-prerequisites" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Prerequisites</label>
                    <input id="event-prerequisites" name="prerequisites" type="text" placeholder="None" value="None"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                <div class="md:col-span-3">
                    <label for="event-image" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Image URL *</label>
                    <input id="event-image" name="image" type="url" required placeholder="https://images.unsplash.com/..."
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                    <p class="text-xs text-stone-500 mt-1.5">Use a wide landscape image for best results.</p>
                </div>
                <div class="md:col-span-2">
                    <span class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Preview</span>
                    <div id="event-image-preview" class="w-full aspect-video rounded-xl border border-stone-200 bg-stone-50 overflow-hidden">
                        <div class="w-full h-full flex items-center justify-center text-xs text-stone-400">Preview appears here</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="event-description" class="block text-[11px] font-semibold text-stone-600 uppercase tracking-wider">Description *</label>
                    <span id="event-description-count" class="text-xs text-stone-500">0 characters</span>
                </div>
                <textarea id="event-description" name="description" rows="5" required placeholder="At least 20 characters describing what students should expect, agenda, speakers, etc."
                          class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20"></textarea>
            </div>

            <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">
                <button id="event-cancel" type="button"
                        class="bg-white border border-stone-200 hover:border-stone-300 text-stone-700 font-medium rounded-full px-5 py-3 text-sm min-h-[44px]">Cancel</button>
                <button id="event-submit" type="submit"
                        class="bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-full px-6 py-3 text-sm min-h-[44px] elevate-1 focus-ring disabled:opacity-60 disabled:cursor-not-allowed">Publish event</button>
            </div>

        </form>

    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/pages/event-form.js"></script>
</body>
</html>
