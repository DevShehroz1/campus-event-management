<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — CampusHub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased flex flex-col min-h-screen">

    <div id="site-header"></div>

    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 py-12 sm:py-16 w-full">
        <div class="w-full max-w-md bg-white rounded-3xl border border-stone-200 p-6 sm:p-8 elevate-2">

            <div role="tablist" aria-label="Sign in or create account" class="flex rounded-full bg-stone-100 p-1 mb-8">
                <button id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="login-form"
                        class="flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-full transition-all text-white bg-stone-900 elevate-1 min-h-[44px]">Sign In</button>
                <button id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="register-form" tabindex="-1"
                        class="flex-1 py-2.5 text-xs font-semibold uppercase tracking-wider rounded-full transition-all text-stone-500 hover:text-stone-900 min-h-[44px]">Create Account</button>
            </div>

            <form id="login-form" role="tabpanel" aria-labelledby="tab-login" class="space-y-5" novalidate>
                <div class="text-center mb-2">
                    <h1 class="text-3xl font-extrabold text-stone-900 tracking-tight">Welcome <span class="font-serif-italic text-orange-600">back</span></h1>
                    <p class="text-stone-500 text-sm mt-1">Sign in with your university email to continue.</p>
                </div>
                <div>
                    <label for="login-email" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">University email</label>
                    <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="you@university.edu"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="login-password" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••"
                               class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 pr-16 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                        <button type="button" data-toggle-password="login-password" aria-label="Show password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-stone-500 hover:text-stone-900 px-2 py-1">Show</button>
                    </div>
                </div>
                <button id="login-submit" type="submit"
                        class="w-full inline-flex items-center justify-center bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-full px-5 py-3 text-sm min-h-[48px] elevate-1 focus-ring disabled:opacity-60 disabled:cursor-not-allowed">Sign in</button>
            </form>

            <form id="register-form" role="tabpanel" aria-labelledby="tab-register" class="space-y-4 hidden" novalidate>
                <div class="text-center mb-2">
                    <h1 class="text-3xl font-extrabold text-stone-900 tracking-tight">Create your <span class="font-serif-italic text-orange-600">account</span></h1>
                    <p class="text-stone-500 text-sm mt-1">Join CampusHub to register for events.</p>
                </div>
                <div>
                    <label for="reg-name" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Full name</label>
                    <input id="reg-name" name="name" type="text" required autocomplete="name" placeholder="Alex Johnson"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="reg-studentid" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Student ID</label>
                    <input id="reg-studentid" name="studentId" type="text" required placeholder="CS-2026-4091"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="reg-email" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">University email</label>
                    <input id="reg-email" name="email" type="email" required autocomplete="email" placeholder="you@university.edu"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <div>
                    <label for="reg-password" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <input id="reg-password" name="password" type="password" required autocomplete="new-password" placeholder="At least 6 characters"
                               class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 pr-16 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                        <button type="button" data-toggle-password="reg-password" aria-label="Show password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-stone-500 hover:text-stone-900 px-2 py-1">Show</button>
                    </div>
                    <p class="text-xs text-stone-500 mt-1.5">Use at least 6 characters.</p>
                </div>
                <div>
                    <label for="reg-password-confirm" class="block text-[11px] font-semibold text-stone-600 mb-1.5 uppercase tracking-wider">Confirm password</label>
                    <input id="reg-password-confirm" name="passwordConfirm" type="password" required autocomplete="new-password" placeholder="Re-enter your password"
                           class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-900 placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                </div>
                <button id="reg-submit" type="submit"
                        class="w-full inline-flex items-center justify-center bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-full px-5 py-3 text-sm min-h-[48px] elevate-1 focus-ring disabled:opacity-60 disabled:cursor-not-allowed">Create account</button>
            </form>

        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/pages/auth.js"></script>
</body>
</html>
